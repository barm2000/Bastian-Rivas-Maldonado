name: Build portfolio data

on:
  push:
    branches: [ main ]
    paths:
      - 'content/**'
      - 'scripts/build_data.py'
      - '.github/workflows/build-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build data
        run: python scripts/build_data.py

      - name: Commit generated data
        run: |
          if git diff --quiet -- data/site-data.js data/site-data.json; then
            echo "No hay cambios en los datos generados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-data.js data/site-data.json
          git commit -m "Auto-update portfolio data"
          git push
